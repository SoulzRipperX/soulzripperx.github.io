<!DOCTYPE html>
<html lang="en">
<head>

<meta name="twitter:title" content="SoulzRipperX · Games Developer">
<meta name="twitter:description" content="Guild Master at Azure 桜 Studios. Games developer based in Japan.">
<meta name="twitter:image" content="https://r2.guns.lol/4df8ee08-93e1-4450-bd6d-cc67552212cd.webp">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{
  --bg:#07090f; --surface:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --text:#eef1f8; --muted:#8e98ad; --accent:#7c9cff; --accent2:#f0abfc; --r:20px;
  --sans:"Inter","Noto Sans Thai",system-ui,sans-serif; --head:"Space Grotesk","Noto Sans Thai",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;
  padding:clamp(16px,4vw,48px);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* Background: your GIF kept, heavily tinted so the UI stays clean */
body::before{content:"";position:fixed;inset:0;z-index:-2;opacity:.5;
  background:url("https://i.pinimg.com/originals/27/1f/9e/271f9e3efbc58dbb075903c7096ba99c.gif") center/cover no-repeat;filter:saturate(.8)}
body::after{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(60% 50% at 15% 0%,rgba(124,156,255,.22),transparent 70%),
             radial-gradient(50% 45% at 90% 10%,rgba(240,171,252,.16),transparent 70%),
             linear-gradient(rgba(7,9,15,.78),rgba(7,9,15,.95))}
main{width:100%;max-width:880px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,28px);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:up .6s ease both;transition:border-color .25s,box-shadow .25s}
@media (hover:hover){
  .card:hover{border-color:rgba(124,156,255,.24);box-shadow:0 18px 60px rgba(0,0,0,.2)}
}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{grid-column:span 6;display:flex;gap:26px;align-items:center}
.about{grid-column:span 4}.links{grid-column:span 2}
.player-card{grid-column:span 6}.skills{grid-column:span 6}

/* Hero */
.avatar{flex:none;width:132px;height:132px;border-radius:32px;padding:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 60px -10px rgba(124,156,255,.55)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:29px;border:3px solid var(--bg);display:block}
.badge{display:inline-flex;align-items:center;gap:8px;font:600 .72rem var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);padding:5px 12px;border:1px solid rgba(124,156,255,.35);border-radius:999px;background:rgba(124,156,255,.08)}
.badge i{font-size:.95rem}
h1{font:700 clamp(2.1rem,6vw,3.2rem)/1.08 var(--head);letter-spacing:-.02em;margin:12px 0 4px}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;font-size:.86rem;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chip i{color:var(--accent)}

/* About / links */
h2{font:600 .76rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.role{font:700 clamp(1.5rem,4vw,2rem)/1.15 var(--head);letter-spacing:-.01em}
.role small{display:block;font:500 .95rem var(--sans);color:var(--muted);margin-top:8px;letter-spacing:0}
.social-list{display:grid;gap:8px}
.social{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--text);
  background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:.92rem;transition:.2s}
.social i{font-size:1.2rem;color:var(--accent)}
.social em{margin-left:auto;font-style:normal;color:var(--muted);transition:.2s}
.social:hover{transform:translateY(-2px);border-color:rgba(124,156,255,.5);background:rgba(124,156,255,.1)}
.social:hover em{color:var(--text);transform:translateX(3px)}
a:focus-visible,button:focus-visible,.bar:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}

/* Player */
.player{display:grid;grid-template-columns:56px minmax(0,1fr) 46px;align-items:center;gap:16px}
.cover{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;transition:box-shadow .25s}
.player-card.is-playing .cover{box-shadow:0 0 0 2px rgba(124,156,255,.35),0 0 24px rgba(124,156,255,.2)}
.meta{min-width:0}
.song-line{display:flex;align-items:center;gap:10px;min-width:0}
.song{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equalizer{display:flex;align-items:flex-end;gap:3px;height:16px;opacity:0;flex:none;transition:opacity .2s}
.equalizer.is-playing{opacity:1}
.equalizer i{display:block;width:3px;height:7px;border-radius:999px;background:var(--accent)}
.equalizer.is-playing i{animation:eq .8s ease-in-out infinite alternate}
.equalizer i:nth-child(2){animation-delay:.15s}.equalizer i:nth-child(3){animation-delay:.3s}.equalizer i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:4px}to{height:16px}}
.times{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.76rem;margin-top:8px;font-variant-numeric:tabular-nums}
.player-status{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
.player-status:empty{display:none}
.bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14);cursor:pointer;position:relative}
.bar span{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn{width:46px;height:46px;border-radius:50%;border:0;flex:none;background:var(--text);color:var(--bg);font-size:1.35rem;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:scale(1.07);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.btn:active{transform:scale(.96)}
.btn:disabled{cursor:not-allowed;opacity:.65}

/* Skills */
.group+.group{margin-top:22px}
.pills{display:flex;flex-wrap:wrap;gap:9px}
.pill{display:inline-flex;align-items:center;gap:9px;padding:8px 14px 8px 10px;border-radius:12px;font-size:.9rem;font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.2s}
.pill:hover{transform:translateY(-2px);border-color:rgba(124,156,255,.5);background:rgba(124,156,255,.09)}
.pill img{width:22px;height:22px;object-fit:contain}
.pill img.inv{filter:brightness(0) invert(1)}
.pill i{font-size:1.3rem;color:var(--accent)}
.pill b{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;background:var(--accent);color:var(--bg)}
footer{grid-column:span 6;text-align:center;color:var(--muted);font-size:.8rem;padding:8px 0 4px}

@media (max-width:680px){
  .hero{flex-direction:column;text-align:center}.chips{justify-content:center}
  .about,.links{grid-column:span 6}
}
@media (max-width:480px){
  .player{grid-template-columns:48px minmax(0,1fr) 42px;gap:10px}
  .cover{width:48px;height:48px}
  .btn{width:42px;height:42px;font-size:1.2rem}
  .times{gap:6px;font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="card hero">
    <div class="avatar"><img src="https://media.discordapp.net/attachments/997325119250772049/1568369069264998581/06da0485a4673ba6d70cbff09dbb7fb9.jpg?ex=6aef9105&is=6aee3f85&hm=db738b4d7d28bff06b65fba858524b0d9d833bcc94d3236a6ab2bfef07f37bf6&=&format=webp&width=1024&height=1024" alt="SoulzRipperX profile picture" width="132" height="132" decoding="async"></div>
    <div>
      <span class="badge"><i class="ri-shield-star-line"></i>Guild Master</span>
      <h1><span>SoulzRipperX</span></h1>
      <p class="tag">Return By Death</p>
      <div class="chips">
        <span class="chip"><i class="ri-map-pin-line"></i>Japan</span>
        <span class="chip"><i class="ri-building-line"></i>Azure 桜 Studios</span>
        <span class="chip"><i class="ri-computer-line"></i>Computer</span>
      </div>
    </div>
  </header>

  <section class="card about">
    <h2>What I do</h2>
    <p class="role">Games Developer<small>Building worlds with Unity, Unreal, Roblox and custom code.</small></p>
  </section>

  <nav class="card links" aria-label="Social links">
    <h2>Connect</h2>
    <div class="social-list">
      <a class="social" href="https://github.com/SoulzRipperX" target="_blank" rel="noopener noreferrer"><i class="ri-github-fill"></i>GitHub<em>↗</em></a>
      <a class="social" href="https://www.facebook.com/Kenjiv845/" target="_blank" rel="noopener noreferrer"><i class="ri-facebook-fill"></i>Facebook<em>↗</em></a>
      <a class="social" href="https://www.instagram.com/kenjy845/" target="_blank" rel="noopener noreferrer"><i class="ri-instagram-fill"></i>Instagram<em>↗</em></a>
    </div>
  </nav>

  <section class="card player-card" aria-label="Music player">
    <div class="player">
      <img class="cover" src="https://images.genius.com/067a0495744df8a2463beb19041ca5da.1000x1000x1.jpg" alt="Album cover for なとり - フライデー・ナイト" width="56" height="56" loading="lazy" decoding="async">
      <div class="meta">
        <div class="song-line">
          <div class="song">なとり - フライデー・ナイト</div>
          <span class="equalizer" id="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="times"><span id="cur">0:00</span>
          <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00"><span id="prog"></span></div>
          <span id="dur">0:00</span></div>
        <span class="player-status" id="playerStatus" role="status" aria-live="polite"></span>
      </div>
      <button class="btn" id="play" type="button" aria-label="Play" aria-pressed="false"><i class="ri-play-fill"></i></button>
      <audio id="audio" loop autoplay preload="metadata" src="https://files.catbox.moe/1arsea.mp3"></audio>
    </div>
  </section>

  <section class="card skills" aria-labelledby="sk"><h2 id="sk">Skills &amp; Tools</h2><div id="skills"></div></section>
  <footer>© <span id="year"></span> SoulzRipperX · Azure 桜 Studios</footer>
</main>

<script>
const dev=n=>`https://cdn.jsdelivr.net/gh/devicons/devicon/icons/${n}/${n}-original.svg`;
const groups=[
 {t:"Languages",i:[["HTML5",dev("html5")],["CSS3",dev("css3")],["JavaScript",dev("javascript")],["Python",dev("python")],["Lua",dev("lua")],["C#",dev("csharp")],["C++",dev("cplusplus")],["SQL","ri-database-2-line"]]},
 {t:"Game Engines",i:[["Unity",dev("unity"),1],["Unreal Engine",dev("unrealengine"),1],["Roblox Studio","https://cdn.simpleicons.org/roblox/ffffff"],["RPG Maker","https://cdn.prod.website-files.com/5efc0159f9a97ba05a8b2902/65b8b3ed67da93688b2de8d6_header-icon-1-56x56.png"],["GameMaker","https://cdn.simpleicons.org/gamemaker/ffffff"]]},
 {t:"Tools",i:[["React",dev("react")],["MongoDB",dev("mongodb")],["GitHub",dev("github"),1],["Git",dev("git")],["VS Code",dev("vscode")],["Terminal","ri-terminal-box-line"]]}];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("skills").innerHTML=groups.map(g=>`<div class="group"><h2>${g.t}</h2><div class="pills">${
 g.i.map(([n,src,inv])=>`<span class="pill">${src.startsWith("ri-")?`<i class="${src}"></i>`:`<img src="${src}" alt="" loading="lazy" class="${inv?"inv":""}" data-l="${esc(n[0])}">`}${esc(n)}</span>`).join("")}</div></div>`).join("");
document.querySelectorAll(".pill img").forEach(im=>im.addEventListener("error",()=>im.replaceWith(Object.assign(document.createElement("b"),{textContent:im.dataset.l}))));

const a=document.getElementById("audio"),btn=document.getElementById("play"),bar=document.getElementById("bar"),
 prog=document.getElementById("prog"),cur=document.getElementById("cur"),dur=document.getElementById("dur"),
 playerCard=document.querySelector(".player-card"),equalizer=document.getElementById("equalizer"),
 status=document.getElementById("playerStatus");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const setStatus=message=>{status.textContent=message};
const updateIcon=()=>{const playing=!a.paused;btn.innerHTML=`<i class="ri-${playing?"pause":"play"}-fill"></i>`;btn.setAttribute("aria-label",playing?"Pause":"Play");btn.setAttribute("aria-pressed",String(playing));playerCard.classList.toggle("is-playing",playing);equalizer.classList.toggle("is-playing",playing)};
const updateProgress=()=>{const p=a.duration?a.currentTime/a.duration*100:0;prog.style.width=p+"%";bar.setAttribute("aria-valuenow",String(Math.round(p)));bar.setAttribute("aria-valuetext",fmt(a.currentTime)+" of "+fmt(a.duration));cur.textContent=fmt(a.currentTime)};
const seekTo=ratio=>{if(!isFinite(a.duration))return;a.currentTime=Math.min(1,Math.max(0,ratio))*a.duration;updateProgress()};
a.volume=.6;
const tryAutoplay=()=>{a.play().catch(()=>setStatus("Autoplay is blocked — press Play to start."))};
a.addEventListener("loadedmetadata",()=>{dur.textContent=fmt(a.duration);updateProgress()});
a.addEventListener("canplay",tryAutoplay,{once:true});
a.addEventListener("timeupdate",updateProgress);
a.addEventListener("play",()=>{setStatus("");updateIcon()});
a.addEventListener("pause",updateIcon);
a.addEventListener("error",()=>{updateIcon();setStatus("Music is unavailable right now.")});
bar.addEventListener("click",e=>{const r=bar.getBoundingClientRect();seekTo((e.clientX-r.left)/r.width)});
bar.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();a.currentTime=Math.max(0,Math.min(a.duration,a.currentTime+(e.key==="ArrowRight"?5:-5)));updateProgress()}
  if(e.key==="Home"||e.key==="End"){e.preventDefault();seekTo(e.key==="Home"?0:1)}
});
btn.addEventListener("click",e=>{e.stopPropagation();if(a.paused){a.play().catch(()=>setStatus("Unable to play music. Try again."))}else a.pause()});
const resumeOnInteraction=e=>{const target=e.target;if(target?.closest?.("#play"))return;if(a.paused)a.play().catch(()=>{})};
window.addEventListener("pointerdown",resumeOnInteraction,{once:true});
window.addEventListener("keydown",resumeOnInteraction,{once:true});
updateIcon();tryAutoplay();
document.getElementById("year").textContent=new Date().getFullYear();
</script>
</body>
</html>
